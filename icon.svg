    <!-- Marcações -->
    <circle cx="256" cy="125" r="8" fill="#111827"/>
    <circle cx="387" cy="256" r="8" fill="#111827"/>
    <circle cx="256" cy="387" r="8" fill="#111827"/>
    <circle cx="125" cy="256" r="8" fill="#111827"/>

